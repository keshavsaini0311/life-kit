[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "life-kit-local"
version = "0.1.0"
description = "A local workspace and evidence-based daily review for your own life."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
life-kit = "lifekit.cli:main"

[tool.setuptools.packages.find]
include = ["lifekit*"]

[tool.setuptools.package-data]
lifekit = ["templates/**/*"]

